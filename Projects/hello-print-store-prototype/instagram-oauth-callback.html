<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram OAuth Callback | Hello Print Store</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f4f6fa;
            color: #111111;
            font-family: 'Noto Sans JP', sans-serif;
            padding: 1.2rem;
        }

        .card {
            width: min(760px, 96vw);
            background: #ffffff;
            border: 1px solid #d9e2f2;
            border-radius: 12px;
            padding: 1.2rem;
            box-shadow: 0 10px 28px rgba(16, 26, 42, 0.08);
        }

        h1 {
            margin: 0;
            font-size: 1.2rem;
        }

        p {
            margin: 0.75rem 0 0;
            color: #3f4a5e;
            line-height: 1.6;
        }

        pre {
            margin: 1rem 0 0;
            background: #0e1626;
            color: #d5e4ff;
            padding: 0.9rem;
            border-radius: 8px;
            overflow: auto;
            font-size: 0.82rem;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Instagram OAuth Callback</h1>
        <p id="status">認証結果を確認しています...</p>
        <pre id="payload"></pre>
        <pre id="nextStep"></pre>
    </main>

    <script>
        const status = document.getElementById('status');
        const payload = document.getElementById('payload');
        const nextStep = document.getElementById('nextStep');
        const params = new URLSearchParams(window.location.search);
        const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));

        const code = params.get('code');
        const accessTokenFromQuery = params.get('access_token');
        const accessTokenFromHash = hashParams.get('access_token');
        const accessToken = accessTokenFromHash || accessTokenFromQuery;
        const expiresInRaw = hashParams.get('expires_in') || params.get('expires_in');
        const expiresIn = Number(expiresInRaw || 0);
        const state = params.get('state');
        const error = params.get('error');
        const errorReason = params.get('error_reason');
        const errorDescription = params.get('error_description');
        const stateStorageKey = 'hps_instagram_oauth_state_v1';
        const returnUrlStorageKey = 'hps_instagram_oauth_return_url_v1';
        const accessTokenStorageKey = 'hps_instagram_access_token_v1';
        const oauthCodeStorageKey = 'hps_instagram_oauth_code_v1';
        const expectedState = sessionStorage.getItem(stateStorageKey);
        const returnUrl = sessionStorage.getItem(returnUrlStorageKey);

        const callbackUrl = `${window.location.origin}${window.location.pathname}`;

        function clearOAuthSessionState() {
            sessionStorage.removeItem(stateStorageKey);
            sessionStorage.removeItem(returnUrlStorageKey);
        }

        function redirectBackToSite() {
            if (returnUrl) {
                window.location.replace(returnUrl);
                return;
            }

            const fallbackPath = window.location.pathname.replace(/instagram-oauth-callback\.html$/, '');
            window.location.replace(`${window.location.origin}${fallbackPath}`);
        }

        if (accessToken) {
            const expiresAt = Number.isFinite(expiresIn) && expiresIn > 0
                ? Date.now() + (expiresIn * 1000)
                : 0;

            localStorage.setItem(accessTokenStorageKey, JSON.stringify({
                accessToken,
                expiresAt,
                savedAt: Date.now(),
                source: 'oauth-callback'
            }));

            status.textContent = 'Instagram連携が完了しました。ホームへ戻ります...';
            payload.textContent = JSON.stringify({
                state,
                has_access_token: true,
                expires_in: expiresIn || null,
                callback_url: callbackUrl
            }, null, 2);
            nextStep.textContent = 'アクセストークンをlocalStorageへ保存しました。';
            clearOAuthSessionState();
            setTimeout(redirectBackToSite, 900);
        } else if (code) {
            if (expectedState && state !== expectedState) {
                status.textContent = 'OAuth認証は完了しましたが、state検証に失敗しました。再度ログインをやり直してください。';
                payload.textContent = JSON.stringify({
                    code,
                    state,
                    expectedState,
                    error: 'state_mismatch'
                }, null, 2);
                nextStep.textContent = '';
                console.error('HPS Instagram OAuth Callback state mismatch:', { state, expectedState });
            } else {
                localStorage.setItem(oauthCodeStorageKey, JSON.stringify({
                    code,
                    state,
                    callbackUrl,
                    savedAt: Date.now()
                }));

                status.textContent = 'OAuth認証は成功しました。取得したcodeをサーバー側でアクセストークンに交換してください。';
                payload.textContent = JSON.stringify({ code, state }, null, 2);
                nextStep.textContent = [
                    'Next step (server-side only):',
                    '',
                    '1) Exchange code to short-lived user token',
                    `GET https://graph.facebook.com/v23.0/oauth/access_token?client_id=APP_ID&client_secret=APP_SECRET&redirect_uri=${encodeURIComponent(callbackUrl)}&code=${encodeURIComponent(code)}`,
                    '',
                    '2) Exchange to long-lived user token',
                    'GET https://graph.facebook.com/v23.0/oauth/access_token?grant_type=fb_exchange_token&client_id=APP_ID&client_secret=APP_SECRET&fb_exchange_token=SHORT_LIVED_USER_TOKEN'
                ].join('\n');
                console.log('HPS Instagram OAuth Callback code:', code);
            }

            clearOAuthSessionState();
        } else if (error) {
            status.textContent = 'OAuth認証でエラーが発生しました。以下を確認してください。';
            payload.textContent = JSON.stringify({
                error,
                error_reason: errorReason,
                error_description: errorDescription,
                callback_url: callbackUrl,
                redirect_uri_expected: callbackUrl,
                state,
                expectedState
            }, null, 2);
            nextStep.textContent = [
                'business/cancel で停止する主な原因:',
                '1) redirect_uri が Meta設定値と1文字でも不一致',
                '2) callback が code 受信前に中断',
                '3) ユーザーまたは設定上の権限キャンセル',
                '',
                'この画面のpayloadを保存し、Metaの有効なRedirect URI設定と完全一致を再確認してください。'
            ].join('\n');
            console.error('HPS Instagram OAuth Callback error:', {
                error,
                error_reason: errorReason,
                error_description: errorDescription
            });
            clearOAuthSessionState();
        } else {
            status.textContent = 'codeまたはerrorが見つかりませんでした。OAuth開始URLを確認してください。';
            payload.textContent = JSON.stringify({
                query: window.location.search,
                hash: window.location.hash,
                callback_url: callbackUrl,
                expectedState
            }, null, 2);
            nextStep.textContent = '';
        }
    </script>
</body>
</html>
