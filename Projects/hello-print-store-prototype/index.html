<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Hello Print Store - Design for Teams. Create for Culture.">
    <title>Hello Print Store</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header (Fixed) -->
    <header class="header">
        <div class="header-container">
            <div class="header-logo">
                <a href="#" class="logo-link">Hello</a>
            </div>
            <nav class="header-nav">
                <ul class="nav-list">
                    <li><a href="#" class="nav-link">WORKS</a></li>
                    <li><a href="#" class="nav-link">FLOW</a></li>
                    <li><a href="#" class="nav-link">ITEMS</a></li>
                    <li><a href="#" class="nav-link">ORIGINALS</a></li>
                    <li><a href="#" class="nav-link">ABOUT</a></li>
                    <li><a href="#" class="nav-link">CONTACT</a></li>
                </ul>
            </nav>
            <button class="menu-toggle" aria-label="メニュー">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Hero Section -->
        <section class="hero" id="hero">
            <!-- Background Image -->
            <div class="hero-bg" style="background-image: url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 1920 1080%22><rect fill=%22%23f0ebe3%22 width=%221920%22 height=%221080%22/><circle cx=%22300%22 cy=%22400%22 r=%22200%22 fill=%22%23d4a574%22 opacity=%220.3%22/><circle cx=%221200%22 cy=%22700%22 r=%22250%22 fill=%22%23e8d7c3%22 opacity=%220.4%22/><circle cx=%221600%22 cy=%22300%22 r=%22150%22 fill=%22%23f4e9dc%22 opacity=%220.3%22/></svg>')"></div>

            <!-- Hero Overlay (for text readability) -->
            <div class="hero-overlay"></div>

            <!-- Hero Content -->
            <div class="hero-content">
                <!-- Logo -->
                <div class="hero-logo" id="heroLogo">
                    <svg class="logo-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                        <!-- Simplified Hello Logo -->
                        <text x="100" y="120" font-size="80" font-weight="bold" text-anchor="middle" fill="currentColor" font-family="'SF Pro Display', sans-serif">
                            Hello
                        </text>
                    </svg>
                </div>

                <!-- Main Message -->
                <div class="hero-message">
                    <h1 class="hero-title">Design for Teams.<br>Create for Culture.</h1>
                </div>

                <!-- CTA Buttons -->
                <div class="hero-cta">
                    <a href="#" class="cta-button cta-secondary">VIEW WORKS</a>
                    <a href="#" class="cta-button cta-primary">START YOUR ORDER</a>
                </div>

                <!-- Scroll Indicator -->
                <div class="scroll-indicator" id="scrollIndicator">
                    <span class="scroll-text">Scroll</span>
                    <svg class="scroll-arrow" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 5v10M7 15l5 5 5-5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </div>
        </section>

        <!-- Next Section (Preview) -->
        <section class="next-section">
            <div class="next-section-content">
                <h2>Our Works</h2>
                <p>Discover the world of Hello Print Store</p>
            </div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="js/script.js"></script>
</body>
</html>
